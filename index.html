<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me</title>

    <style>
        *
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }
        body
        {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #27d0d0;
        }
        .container
        {
            width: 360px;
            background: #f5eaea;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            position: relative;
        }
        .container video, .container img
        {
            width: 150px;
            margin-bottom: 15px;
        }
        h2
        {
            font-size: 22px;
            margin-bottom: 20px;
        }
        .button-container
        {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 80px;
        }
        button
        {
            padding: 10px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            position: absolute;
        }
        .yes-btn
        {
            background: #ff4d6d;
            color: white;
            left: 30%;
            z-index: 2;
        }
        .no-btn
        {
            background: #ffb3c1;
            position: absolute;
            left: 60%;
        }
        button:hover
        {
            transform: scale(1.1);
        }
        .result-container
        {
            display: none;
        }
        .loader
        {
            margin-top: 15px;
        }
        .heart
        {
            width: 20px;
            height: 20px;
            background: #ff4d6d;
            position: relative;
            transform: rotate(-45deg);
            animation: beat 1s infinite;
            margin: 20px auto;
        }
        .heart::before, .heart::after
        {
            content: "";
            width: 20px;
            height: 20px;
            background: #ff4d6d;
            border-radius: 50%;
            position: absolute;
        }
        .heart::before
        {
            top: -10px;
            left: 0;
        }
        .heart::after
        {
            left: 10px;
            top: 0;
        }
        @keyframes beat
        {
            0%
            {transform: scale(1);}
            50%
            {transform: scale(1.3);}
            100%
            {transform: scale(1);}
        }
    </style>
</head>
<body>
    <div class = "container question-container" id = "questionContainer">
        <img src = "reply.jpg" alt = "Cute Gif">
        <h2>Do you love me?</h2>

        <div class = "button-container">
            <button class = "yes-btn" id = "yesBtn">Yes</button>
            <button class = "no-btn" id = "noBtn" onclick = "noBtn">No</button>
        </div>
    </div>

    <div class = "container result-container" id = "resultContainer">
        <video src = "love.mp4" autoplay loop></video>
        <h2>I knew it! &#129330; &#128525;</h2>

        <div class = "loader">
            <div class = "heart"></div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");

        const questionContainer = document.getElementById("questionContainer");
        const resultContainer = document.getElementById("resultContainer");

        function moveButton()
        {
            const x = Math.random() * 250;
            const y = Math.random() * 80;

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        noBtn.addEventListener("mouseover", moveButton);
        noBtn.addEventListener("touchstart", moveButton);

            yesBtn.onclick = function()
                {
                    questionContainer.style.display = "none";
                    resultContainer.style.display = "block";
                };
    </script>
</body>
</html>
